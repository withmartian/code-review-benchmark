name: Tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  offline:
    name: Offline tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: offline
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --dev
      - run: uv run ruff check .
      - run: uv run pytest tests/

  online-etl:
    name: Online ETL tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: online/etl
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the prompt-pin check compares with the merge-base
      - uses: astral-sh/setup-uv@v5
        with:
          python-version-file: online/etl/.python-version
      - run: uv sync --dev
      - run: uv run ruff check .
      - run: uv run pytest tests/
        env:
          # a pull request compares with its base branch, a push with the commit the push started from
          # (all zeros for a new branch, or a sha a force-push dropped from the clone: the test then
          # says there is nothing to compare)
          PROMPT_PINS_BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
